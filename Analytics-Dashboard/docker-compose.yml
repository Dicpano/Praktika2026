# Аналітичний дашборд (синтетичні дані). Запуск: docker compose up -d → http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      TZ: Europe/Kyiv
      PGTZ: Europe/Kyiv
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 01_schema, 02_views, 03_seed — лише при першому старті
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"      # доступ з цього ПК (pgAdmin, DBeaver); назовні не відкрито
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dashboard}
      DB_RO_USER: dashboard_ro
      DB_RO_PASSWORD: ${DB_RO_PASSWORD:-dashboard_ro_local}
      DB_RW_USER: dashboard_rw                     # лише INSERT/DELETE — для вкладки «Внесення даних»
      DB_RW_PASSWORD: ${DB_RW_PASSWORD:-dashboard_rw_local}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
