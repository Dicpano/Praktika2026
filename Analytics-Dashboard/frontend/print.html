<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Довідка щодо обстановки</title>
  <style>
    /* Оформлення за пп. 1.3–1.4 Порядку: A4, поля ліве 30, праве 10, верхнє 20, нижнє 20 мм;
       Times New Roman 14 пт; нумерація сторінок посередині верхнього поля. */
    @page { size: A4; margin: 20mm 10mm 20mm 30mm;
      @top-center { content: counter(page); font-family: "Times New Roman", serif; font-size: 12pt; } }
    @page :first { @top-center { content: none; } }
    :root { color-scheme: light; }
    body { font-family: "Times New Roman", Times, serif; font-size: 14pt; line-height: 1.25; color: #000; background: #fff; margin: 0; }
    .sheet { max-width: 170mm; margin: 0 auto; padding: 16px; }
    @media print { .sheet { padding: 0; max-width: none; } .noprint { display: none; } }
    .mark { text-align: right; font-size: 12pt; }
    h1 { font-size: 14pt; text-align: center; font-weight: 700; margin: 12pt 0 0; }
    .subtitle { text-align: center; margin: 0 0 12pt; }
    p { text-indent: 12.5mm; margin: 0 0 6pt; text-align: justify; }
    table { border-collapse: collapse; width: 100%; font-size: 12pt; margin: 0 0 12pt; page-break-inside: auto; }
    caption { caption-side: top; text-align: left; padding-bottom: 4pt; }
    caption .num { display: block; text-align: right; }
    th, td { border: 1px solid #000; padding: 2pt 4pt; vertical-align: top; }
    th { font-weight: 400; text-align: center; }
    td.n { text-align: right; }
    tr { page-break-inside: avoid; }
    .foot { font-size: 12pt; margin-top: 12pt; }
    .noprint { font-family: system-ui, sans-serif; font-size: 12px; background: #F4F1E8; padding: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="noprint">Попередній перегляд довідки. <button type="button" onclick="window.print()">Друк / зберегти як PDF</button></div>
    <div class="mark">По навчанню<br>Синтетичні дані</div>
    <div id="doc">Формування довідки…</div>
  </div>
  <script src="js/print.bundle.js"></script>
</body>
</html>
